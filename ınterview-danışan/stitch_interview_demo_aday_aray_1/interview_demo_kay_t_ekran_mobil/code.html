<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Interview Demo - Kayıt</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F6F4EF;
      color: #1E1E1C;
      -webkit-font-smoothing: antialiased;
    }
    input:focus {
      outline: none;
      border-color: #1F4B4A;
    }
  </style>
<link rel="stylesheet" href="../../../theme.css"></head>
<body class="bg-[#F6F4EF] text-[#1E1E1C] min-h-screen flex justify-center items-start p-0 sm:p-4">
<!-- Mobil Konteyner: 390px genişlik -->
<main class="w-full max-w-[390px] min-h-screen bg-[#F6F4EF] flex flex-col justify-between px-6 py-8">
<!-- Üst Bölüm: Logo, İlerleme ve Form Başlığı -->
<div class="w-full flex flex-col">
<!-- Logo: Yalnızca metin, ikonsuz -->
<header class="mb-8">
<span class="text-[17px] font-semibold tracking-tight text-[#1E1E1C]">
          Interview Demo
        </span>
</header>
<!-- İlerleme Bölümü: 3 Adımlı İnce Gösterge -->
<section aria-label="İlerleme Durumu" class="mb-8">
<div class="flex items-center justify-between text-[13px] font-medium text-[#5E5A52] mb-2.5">
<span class="text-[#1E1E1C] font-semibold">Kayıt</span>
<span class="tabular-nums">1 / 3</span>
</div>
<!-- 3 parçalı ince ilerleme çizgisi -->
<div class="grid grid-cols-3 gap-1.5 w-full h-[3px]">
<div class="h-full bg-[#1F4B4A] rounded-full"></div>
<div class="h-full bg-[#E3DFD6] rounded-full"></div>
<div class="h-full bg-[#E3DFD6] rounded-full"></div>
</div>
<div class="flex justify-between text-[11px] text-[#5E5A52] mt-1.5">
<span class="text-[#1F4B4A] font-medium">1. Kayıt</span>
<span>2. Hizmet ve guru</span>
<span>3. Ödeme</span>
</div>
</section>
<!-- Başlık ve Sakin Açıklama -->
<section class="mb-8">
<h1 class="text-[24px] leading-[32px] font-semibold text-[#1E1E1C] mb-2.5">
          Hesabını oluştur
        </h1>
<p class="text-[15px] leading-[22px] text-[#5E5A52]">Yalnızca adını, e-postanı ve bir şifreni istiyoruz. Diğer bilgileri süreç içinde, ihtiyaç oldukça alacağız.</p>
</section>
<!-- Kayıt Formu: Yalnızca 2 alan, 52px yükseklik, 8px köşe, sıfır gölge -->
<form class="flex flex-col gap-5" onsubmit="event.preventDefault();">
<div class="flex flex-col">
<label class="text-[14px] font-medium text-[#1E1E1C] mb-2" for="full_name">
            Ad soyad
          </label>
<input class="w-full h-[52px] px-4 rounded-[8px] bg-white border border-[#E3DFD6] text-[16px] text-[#1E1E1C] placeholder:text-[#5E5A52]/50 transition-colors" id="full_name" name="full_name" placeholder="Örn. Selin Yılmaz" type="text"/>
</div>
<div class="flex flex-col">
<label class="text-[14px] font-medium text-[#1E1E1C] mb-2" for="email">
            E-posta
          </label>
<input class="w-full h-[52px] px-4 rounded-[8px] bg-white border border-[#E3DFD6] text-[16px] text-[#1E1E1C] placeholder:text-[#5E5A52]/50 transition-colors" id="email" name="email" placeholder="ornek@alanadi.com" type="email"/>
</div><div class="flex flex-col">
<label class="text-[14px] font-medium text-[#1E1E1C] mb-2" for="password">
            Şifre
          </label>
<div class="relative flex items-center">
<input class="w-full h-[52px] px-4 pr-11 rounded-[8px] bg-white border border-[#E3DFD6] text-[16px] text-[#1E1E1C] placeholder:text-[#5E5A52]/50 transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
<button aria-label="Şifreyi göster veya gizle" class="absolute right-3.5 text-[#5E5A52] hover:text-[#1E1E1C] flex items-center justify-center p-1 transition-colors cursor-pointer" onclick="const inp = document.getElementById('password'); inp.type = inp.type === 'password' ? 'text' : 'password';" type="button">
<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
<circle cx="12" cy="12" r="3"></circle>
</svg>
</button>
</div>
<span class="text-[12px] text-[#5E5A52] mt-1.5">En az 8 karakter</span>
</div>
<!-- Tek Birincil Buton: 52px tam genişlik, koyu petrol yeşili (#1F4B4A), sıfır gölge -->
<div class="mt-3 flex flex-col gap-3.5">
<button class="w-full h-[52px] bg-[#1F4B4A] hover:bg-[#183c3b] active:bg-[#122e2d] text-white font-medium text-[16px] rounded-[8px] transition-colors flex items-center justify-center cursor-pointer" type="submit">
            Devam et
          </button>
<!-- İkincil Eylem / Giriş Bağlantısı -->
<p class="text-center text-[14px] text-[#5E5A52]">
            Zaten hesabın var mı? <a class="text-[#1F4B4A] font-medium hover:underline ml-1" href="#">Giriş yap</a>
</p>
</div>
</form>
</div>
<!-- Alt Bilgilendirme: 14 px sakin gri metin -->
<footer class="pt-8 pb-2 text-center">
<p class="text-[14px] text-[#5E5A52] leading-normal">
        E-postana bir doğrulama kodu göndereceğiz.
      </p>
</footer>
</main>

  const currentPath = (location.pathname || '/').replace(/\/+$|index.html$/g, '') || '/';
  const current = currentPath === '' ? '/' : currentPath;
  const pages = pageNames[current] || [current];
  const idx = Math.max(0, pages.indexOf(current));
  const prevPage = pages[(idx - 1 + pages.length) % pages.length];
  const nextPage = pages[(idx + 1) % pages.length];

  const nav = document.createElement('div');
  nav.id = 'demo-flow-nav';
  nav.style.position = 'fixed';
  nav.style.left = '50%';
  nav.style.bottom = '18px';
  nav.style.transform = 'translateX(-50%)';

  nav.style.zIndex = '99999';

  document.body.appendChild(nav);

  const goNext = function (event) {
    if (event) event.preventDefault();
    window.location.href = nextPage;
  };

  document.querySelectorAll('a[href="#"], button[type="submit"], form').forEach(function (el) {
    if (el.closest('#demo-flow-nav')) return;
    if (el.tagName === 'A' && el.getAttribute('href') && el.getAttribute('href') !== '#') return;
    if (el.tagName === 'BUTTON' && el.type === 'submit') {
      el.addEventListener('click', goNext);
    }
    if (el.tagName === 'FORM') {
      el.addEventListener('submit', goNext);
    }
    if (el.tagName === 'A' && el.getAttribute('href') === '#') {
      el.addEventListener('click', function (event) {
        event.preventDefault();
        goNext();
      });
    }
