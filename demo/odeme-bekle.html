<script>
    (function() {
      // Hizmet Seçimi
      const serviceCards = document.querySelectorAll('.service-card');
      const summaryService = document.getElementById('summary-service');
      const summarySession = document.getElementById('summary-session');
      const summaryPrice = document.getElementById('summary-price');

      serviceCards.forEach(card => {
        card.addEventListener('click', () => {
          serviceCards.forEach(c => {
            c.classList.remove('active', 'border-2', 'border-primary-petrol', 'bg-light-petrol');
            c.classList.add('border', 'border-card-border', 'bg-white');
            const icon = c.querySelector('.check-icon');
            if (icon) icon.classList.add('hidden');
          });

          card.classList.add('active', 'border-2', 'border-primary-petrol', 'bg-light-petrol');
          card.classList.remove('border', 'border-card-border', 'bg-white');
          const activeIcon = card.querySelector('.check-icon');
          if (activeIcon) activeIcon.classList.remove('hidden');

          if (summaryService) summaryService.textContent = card.dataset.serviceName || '';
          if (summarySession) summarySession.textContent = card.dataset.sessionInfo ? card.dataset.sessionInfo.replace('her seans ', '') : '1 × 50 dk';
          if (summaryPrice) summaryPrice.textContent = card.dataset.price || '1.500 ₺';
        });
      });

      // Guru Seçimi
      const guruCards = document.querySelectorAll('.guru-card');
      const summaryGuru = document.getElementById('summary-guru');

      guruCards.forEach(card => {
        card.addEventListener('click', () => {
          guruCards.forEach(g => {
            g.classList.remove('active', 'border-2', 'border-primary-petrol', 'bg-light-petrol');
            g.classList.add('border', 'border-card-border', 'bg-white');
            const ind = g.querySelector('.radio-indicator');
            if (ind) {
              ind.className = 'radio-indicator w-5 h-5 rounded-full border border-card-border flex items-center justify-center flex-shrink-0 mt-0.5';
              ind.innerHTML = '<span class="w-2 h-2 rounded-full bg-transparent"></span>';
            }
          });

          card.classList.add('active', 'border-2', 'border-primary-petrol', 'bg-light-petrol');
          card.classList.remove('border', 'border-card-border', 'bg-white');
          const activeInd = card.querySelector('.radio-indicator');
          if (activeInd) {
            activeInd.className = 'radio-indicator w-5 h-5 rounded-full bg-primary-petrol flex items-center justify-center flex-shrink-0 mt-0.5';
            activeInd.innerHTML = '<span class="w-2 h-2 rounded-full bg-white"></span>';
          }

          if (summaryGuru) summaryGuru.textContent = card.dataset.guruName || '';
        });
      });

      // Arama & Sektör Filtreleme
      const searchInput = document.getElementById('guru-search');
      const sectorFilter = document.getElementById('sector-filter');

      function filterGurus() {
        const query = (searchInput.value || '').toLowerCase().trim();
        const sector = (sectorFilter.value || 'all').toLowerCase();

        guruCards.forEach(card => {
          const text = card.textContent.toLowerCase();
          const cardSector = (card.dataset.sector || '').toLowerCase();
          const matchesQuery = query === '' || text.includes(query);
          const matchesSector = sector === 'all' || cardSector === sector;

          if (matchesQuery && matchesSector) {
            card.style.display = 'flex';
          } else {
            card.style.display = 'none';
          }
        });
      }

      if (searchInput) searchInput.addEventListener('input', filterGurus);
      if (sectorFilter) sectorFilter.addEventListener('change', filterGurus);
    })();
  </script>

  const currentPath = (location.pathname || '/').replace(/\/+$|index.html$/g, '') || '/';

  const pages = pageNames[current] || [current];
