<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Müsaitlik ekle · Interview Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="../theme.css">
  <script src="config.js"></script>
<script src="api-client.js"></script>
<script src="gate.js"></script>
<script src="guru-ortak.js"></script>
<link rel="stylesheet" href="avatar.css"></head>
<body class="min-h-screen bg-background font-['IBM_Plex_Sans'] text-[#1E1E1C] antialiased">
  <main class="mx-auto w-full px-4 py-8 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 items-start gap-6">
      <aside class="advisor-sidebar availability-form-sidebar w-full">
        <div class="flex min-h-[580px] flex-col justify-between rounded-[10px] border border-outline-variant bg-white p-4 shadow-sm">
          <div>
            <div class="mb-2 flex items-center gap-2 border-b border-outline-variant px-4 py-2">
              
              <span class="text-[14px] font-semibold text-[#51409D]">Interview Demo</span>
            </div>
            <nav class="flex flex-col gap-1">
              <a class="flex items-center justify-between rounded-lg px-4 py-2 text-[14px] text-[#51409D] hover:bg-surface-container-low" href="guru-danisanlar.html"><span class="flex items-center gap-2"><svg class="availability-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19v-1.2a5.5 5.5 0 0 1 11 0V19zM16 5.2a3.2 3.2 0 0 1 0 6.2M17 14a5 5 0 0 1 3.5 4.8V19"/></svg><span>Danışanlarım</span></span></a>
              <a aria-current="page" class="flex items-center justify-between rounded-[8px] bg-[#51409D] px-4 py-2 text-[14px] font-semibold text-white" href="guru-musaitlik.html"><span class="flex items-center gap-2"><svg class="availability-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M7.5 3v4M16.5 3v4M3.5 9.5h17M8 14l2.5 2.5L16 11"/></svg><span>Müsaitlik</span></span><svg class="availability-icon availability-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
              <a class="flex items-center justify-between rounded-lg px-4 py-2 text-[14px] text-[#51409D] hover:bg-surface-container-low" href="guru-seanslar.html"><span class="flex items-center gap-2"><svg class="availability-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M7.5 3v4M16.5 3v4M3.5 9.5h17M8 13h2m4 0h2m-8 4h2m4 0h2"/></svg><span>Seanslarım</span></span></a>
            </nav>
          </div>
          <div class="mt-8 flex items-center gap-3 border-t border-outline-variant px-1 pt-4">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-[#51409D] text-[14px] font-semibold text-white"></div>
            <div><div class="text-[14px] font-semibold text-[#51409D]"></div><div class="text-[11px] text-[#51409D]">Danışman</div></div>
          </div>
        </div>
      </aside>

      <section class="w-full">
        <div class="mb-5">
          <h1 class="text-[24px] font-semibold leading-tight text-[#1E1E1C]">Müsaitlik ekle</h1>
          <p class="mt-1 text-[14px] text-muted">Her seans 50 dakikadır. Adaylar yalnızca açtığın saatlerden randevu alabilir.</p>
        </div>
        <div class="rounded-[10px] border border-outline-variant bg-white p-5 shadow-sm sm:p-8">
          <form id="availability-form" novalidate>
            <div class="availability-date-field mb-5 text-[14px] font-semibold text-[#1E1E1C]">
              <label for="availability-date">Tarih</label>
              <span class="availability-date-control mt-2">
                <input id="availability-date" class="w-full rounded-[8px] border border-[#DEDaf4] px-3 py-2.5 pr-12 text-[14px] font-normal text-[#1E1E1C] focus:border-[#51409D] focus:outline-none focus:ring-0" type="date" value="">
                <button class="availability-date-picker" type="button" aria-label="Takvimi aç" aria-controls="availability-date">
                  <svg class="availability-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M7.5 3v4M16.5 3v4M3.5 9.5h17M8 13h2m4 0h2m-8 4h2m4 0h2"/></svg>
                </button>
              </span>
            </div>

            <div class="mb-5">
              <div id="time-rows" class="flex flex-col gap-3"></div>
              <span id="availability-end-help" class="sr-only">Bitiş saati, başlangıç saatine 50 dakika eklenerek otomatik hesaplanır.</span>
            </div>

            <a id="add-time" class="availability-add-time inline-flex" href="#">+ Başka saat ekle</a>

            <div class="mt-6 border-t border-outline-variant pt-5">
              <label class="inline-flex cursor-pointer items-center gap-2 text-[14px] font-semibold text-[#1E1E1C]">
                <input id="repeat-weekly" class="h-4 w-4 rounded border-[#51409D] text-[#51409D] focus:ring-[#51409D]" type="checkbox">
                Her hafta tekrarla
              </label>
              <label id="repeat-count-wrap" class="mt-4 hidden max-w-[220px] text-[14px] font-medium text-[#1E1E1C]" for="repeat-count">
                Kaç hafta?
                <select id="repeat-count" class="mt-2 block w-full rounded-[8px] border border-[#DEDaf4] bg-white px-3 py-2.5 text-[14px] focus:border-[#51409D] focus:outline-none focus:ring-0">
                  <option value="4" selected>4</option><option value="8">8</option><option value="12">12</option>
                </select>
              </label>
            </div>

            <div class="mt-6 rounded-[8px] border border-outline-variant bg-surface-container-low p-4">
              <h2 id="preview-heading" class="text-[14px] font-semibold text-[#1E1E1C]">Eklenecek saatler (0)</h2>
              <ul id="preview-list" aria-live="polite" class="mt-3 flex flex-col gap-2 text-[13px] text-muted"></ul>
            </div>

            <p id="form-error" class="mt-4 hidden text-[14px] text-[#B42318]" role="alert" aria-live="polite"></p>
            <div class="mt-7 flex items-center justify-between gap-4 border-t border-outline-variant pt-5">
              <a class="text-[14px] font-semibold text-muted hover:text-[#1E1E1C]" href="guru-musaitlik.html">← Vazgeç</a>
              <button id="save-availability" class="availability-save-button rounded-[8px] bg-[#51409D] px-6 py-2.5 text-[14px] font-semibold text-white shadow-sm hover:opacity-90" type="submit" disabled>0 saat ekle</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>


<script src="availability.js"></script>
  <script src="guru-musaitlik-ekle.js"></script>
  <script src="nav.js"></script>
  <script src="ortak.js"></script>
  <script src="secim.js"></script>
<script src="avatar.js"></script></body>
</html>
