<!DOCTYPE html>
<html lang="tr">
<head>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500&amp;family=Onest:wght@400&amp;display=swap" rel="stylesheet">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Müsaitlik ekle · Interview Demo</title>
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/demo/pattern.css">
  <script src="/demo/config.js"></script><script src="/demo/routes.js"></script><script src="/demo/api-client.js"></script><script src="/demo/gate.js"></script><script src="/demo/guru-ortak.js"></script>
<link rel="stylesheet" href="/demo/avatar.css"><link rel="stylesheet" href="/demo/sidebar.css"><link rel="stylesheet" href="/demo/takvim.css"></head>
<body class="min-h-screen bg-background font-['IBM_Plex_Sans'] text-[#1E1E1C] antialiased">
  <main class="mx-auto w-full px-4 py-8 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 items-start gap-6">
      <aside id="sidebar" data-role="danisman" aria-label="Danışman menüsü"></aside>

      <section class="w-full">
        <div class="mb-5">
          <h1 class="text-[24px] font-semibold leading-tight text-[#1E1E1C]">Müsaitlik ekle</h1>
          <p class="mt-1 text-[14px] text-muted">Her seans 60 dakikadır. Adaylar yalnızca açtığın saatlerden randevu alabilir.</p>
        </div>
        <div class="rounded-[var(--radius-card)] border border-[var(--color-rule)] bg-[var(--color-paper)] p-5 shadow-none sm:p-8">
          <form id="availability-form" novalidate>
            <div class="availability-date-field mb-5 text-[14px] font-semibold text-[#1E1E1C]">
              <label for="availability-date">Tarih</label>
              <span class="availability-date-control mt-2">
                <input id="availability-date" class="w-full rounded-[var(--radius-pill)] border border-[var(--color-rule-2)] px-3 py-2.5 pr-12 text-[14px] font-normal text-[var(--color-ink)] focus:border-[var(--color-focus)] focus:outline-none focus:ring-0" type="date" value="">
                <button class="availability-date-picker" type="button" aria-label="Takvimi aç" aria-controls="availability-date">
                  <svg class="availability-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M7.5 3v4M16.5 3v4M3.5 9.5h17M8 13h2m4 0h2m-8 4h2m4 0h2"/></svg>
                </button>
              </span>
            </div>

            <div class="mb-5">
              <div id="time-rows" class="flex flex-col gap-3"></div>
              <span id="availability-end-help" class="sr-only">Bitiş saati, başlangıç saatine 60 dakika eklenerek otomatik hesaplanır.</span>
            </div>

            <a id="add-time" class="availability-add-time inline-flex" href="#">+ Başka saat ekle</a>

            <div class="mt-6 border-t border-outline-variant pt-5">
              <label class="inline-flex cursor-pointer items-center gap-2 text-[14px] font-semibold text-[#1E1E1C]">
                <input id="repeat-weekly" class="h-4 w-4 rounded border-[var(--color-rule-2)] text-[var(--color-accent)] focus:ring-[var(--color-focus)]" type="checkbox">
                Her hafta tekrarla
              </label>
              <label id="repeat-count-wrap" class="mt-4 hidden max-w-[220px] text-[14px] font-medium text-[#1E1E1C]" for="repeat-count">
                Kaç hafta?
                <select id="repeat-count" class="mt-2 block w-full rounded-[var(--radius-card)] border border-[var(--color-rule-2)] bg-[var(--color-paper)] px-3 py-2.5 text-[14px] focus:border-[var(--color-focus)] focus:outline-none focus:ring-0">
                  <option value="4" selected>4</option><option value="8">8</option><option value="12">12</option>
                </select>
              </label>
            </div>

            <div class="mt-6 rounded-[var(--radius-card)] border border-[var(--color-rule)] bg-[var(--color-paper-2)] p-4">
              <h2 id="preview-heading" class="text-[14px] font-semibold text-[#1E1E1C]">Eklenecek saatler (0)</h2>
              <ul id="preview-list" aria-live="polite" class="mt-3 flex flex-col gap-2 text-[13px] text-muted"></ul>
            </div>

            <p id="form-error" class="mt-4 hidden text-[14px] text-[var(--color-ink)]" role="alert" aria-live="polite"></p>
            <div class="mt-7 flex items-center justify-between gap-4 border-t border-outline-variant pt-5">
              <a class="text-[14px] font-semibold text-muted hover:text-[#1E1E1C]" href="/guru/musaitlik">← Vazgeç</a>
              <button id="save-availability" class="availability-save-button rounded-[var(--radius-pill)] bg-[var(--color-accent)] px-6 py-2.5 text-[14px] font-semibold text-[var(--color-accent-ink)] shadow-none hover:opacity-90" type="submit" disabled>0 saat ekle</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>


<script src="/demo/sidebar.js"></script><script src="/demo/availability.js"></script>
  <script src="/demo/guru-musaitlik-ekle.js"></script><script src="/demo/takvim-secici.js"></script>
  <script src="/demo/nav.js"></script>
  <script src="/demo/ortak.js"></script>
  <script src="/demo/secim.js"></script>
<script src="/demo/avatar.js"></script></body>
</html>
