<script>
(function () {
  const storageKey = 'demoOdevler';
  const defaults = [
    { id: 'sunum', baslik: 'Daha önce hazırlanmış bir sunum veya rapor', tur: 'Belge', sonTarih: '15 Ocak', durum: 'bekliyor' },
    { id: 'ilan', baslik: 'Hedef rolün iş ilanı', tur: 'Belge', sonTarih: '10 Ocak', durum: 'teslim', teslimTarihi: '12 Ocak', tip: 'link', icerik: 'https://www.linkedin.com/jobs/view/ornek-ilan', aciklama: '' }
  ];
  const list = document.querySelector('main section .divide-y');
  if (!list) return;

  function loadTasks() {
    const saved = localStorage.getItem(storageKey);
    if (saved === null) {
      localStorage.setItem(storageKey, JSON.stringify(defaults));
      return defaults;
    }

    try {
      const tasks = JSON.parse(saved);
      if (!Array.isArray(tasks)) throw new TypeError('demoOdevler bir JSON dizisi olmalı.');
      return tasks;
    } catch (error) {
      console.error('demoOdevler verisi okunamadı; varsayılan ödevler yükleniyor.', error);
      localStorage.setItem(storageKey, JSON.stringify(defaults));
      return defaults;
    }
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, function (char) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
    });
  }

  function renderTasks(tasks) {
    list.innerHTML = tasks.map(function (task) {
      const delivered = task.durum === 'teslim';
      const label = delivered
        ? 'Teslim edildi · ' + escapeHtml(task.teslimTarihi || '')
        : 'Bekliyor';
      const icon = task.tip === 'link' ? 'link' : 'description';
      const details = delivered
        ? '<span class="theme-status-badge theme-status-badge--success">' + label + '</span><a class="text-[14px] font-semibold text-[#51409D] hover:underline underline-offset-4 py-1" href="odev-goruntule.html?id=' + encodeURIComponent(task.id) + '">Görüntüle</a>'
        : '<span class="theme-status-badge theme-status-badge--warning">Bekliyor</span><button class="inline-flex items-center justify-center px-4 py-2 rounded-[8px] bg-[#51409D] text-on-primary font-semibold text-[14px] shadow-sm hover:opacity-90 transition-all" type="button" data-deliver-id="' + escapeHtml(task.id) + '">Teslim Et</button>';
      const secondary = 'Son tarih ' + escapeHtml(task.sonTarih || '');

      return '<div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 gap-4 bg-[#FFFFFF]">' +
        '<div class="flex items-center gap-3.5"><div class="w-10 h-10 rounded-[8px] bg-surface-container-low text-[#51409D] flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-[22px]">' + icon + '</span></div>' +
        '<div class="flex flex-col"><h2 class="text-[16px] font-semibold text-[#1E1E1C] leading-tight">' + escapeHtml(task.baslik) + '</h2><span class="text-[14px] text-muted mt-0.5">' + secondary + '</span></div></div>' +
        '<div class="flex items-center gap-3 shrink-0 self-end sm:self-center">' + details + '</div></div>';
    }).join('');
  }

  renderTasks(loadTasks());
  list.addEventListener('click', function (event) {
    const button = event.target.closest('[data-deliver-id]');
    if (!button) return;
    location.href = 'odev-teslim.html?id=' + encodeURIComponent(button.dataset.deliverId);
  });

  const params = new URLSearchParams(location.search);
  if (params.get('teslim') === '1') {
    const notice = document.createElement('div');
    notice.className = 'rounded-[8px] border border-[#BCB7F5] bg-[#EEECFF] px-4 py-3 text-[14px] font-semibold text-[#51409D]';
    notice.setAttribute('role', 'status');
    notice.textContent = 'Ödevin teslim edildi. Danışmanın görebilir.';
    const section = document.querySelector('main section');
    section.insertBefore(notice, section.firstChild);
    window.setTimeout(function () { notice.remove(); }, 5000);
    params.delete('teslim');
    const query = params.toString();
    history.replaceState(null, '', location.pathname + (query ? '?' + query : '') + location.hash);
  }
})();
</script>

  const currentPath = (location.pathname || '/').replace(/\/+$|index.html$/g, '') || '/';
  const current = currentPath === '' ? '/' : currentPath;
  const pages = pageNames[current] || [current];
  const idx = Math.max(0, pages.indexOf(current));
  const prevPage = pages[(idx - 1 + pages.length) % pages.length];
  const nextPage = pages[(idx + 1) % pages.length];

  const nav = document.createElement('div');
  nav.id = 'demo-flow-nav';
  nav.style.position = 'fixed';
  nav.style.left = '50%';
  nav.style.bottom = '18px';
  nav.style.transform = 'translateX(-50%)';
  nav.style.display = 'flex';
  nav.style.gap = '10px';
  nav.style.padding = '8px 12px';
  nav.style.background = 'var(--color-paper)';
  nav.style.color = 'var(--color-ink)';
  nav.style.border = '1px solid var(--color-rule)';
  nav.style.borderRadius = '999px';
  
  nav.style.zIndex = '99999';
  nav.style.fontFamily = 'IBM Plex Sans, sans-serif';
  nav.innerHTML = '<a href="' + prevPage + '" style="color:var(--color-ink); text-decoration:none; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,0.08);">Önceki</a><a href="/" style="color:var(--color-ink); text-decoration:none; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,0.08);">Ana sayfa</a><a href="' + nextPage + '" style="color:var(--color-ink); text-decoration:none; padding:8px 12px; border-radius:999px; background:var(--color-accent);">Sonraki</a>';
  document.body.appendChild(nav);

  const goNext = function (event) {
    if (event) event.preventDefault();
    window.location.href = nextPage;
  };

  document.querySelectorAll('a[href="#"], button[type="submit"], form').forEach(function (el) {
    if (el.closest('#demo-flow-nav')) return;
    if (el.tagName === 'A' && el.getAttribute('href') && el.getAttribute('href') !== '#') return;
    if (el.tagName === 'BUTTON' && el.type === 'submit') {
      el.addEventListener('click', goNext);
    }
    if (el.tagName === 'FORM') {
      el.addEventListener('submit', goNext);
    }
    if (el.tagName === 'A' && el.getAttribute('href') === '#') {
      el.addEventListener('click', function (event) {
        event.preventDefault();
        goNext();
      });
    }
  });
})();
